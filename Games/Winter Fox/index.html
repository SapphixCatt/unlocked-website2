<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | WinterFox</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Reset page margins and prevent scrollbars */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
      /* Force the container to take up the full screen */
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
      /* Force the canvas to match the parent container size completely */
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      /* Center the loading bar over the full-screen canvas */
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
      
      <div id="unity-loading-bar" style="display: none;">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full" style="width: 0%;"></div>
        </div>
      </div>
      
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
    </div>
    
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WinterFox.loader.js";
      var config = {
        dataUrl: buildUrl + "/WinterFox.data.unityweb",
        frameworkUrl: buildUrl + "/WinterFox.framework.js.unityweb",
        codeUrl: buildUrl + "/WinterFox.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Witching Games",
        productName: "WinterFox",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var mobileWarning = document.querySelector("#unity-mobile-warning");

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element. This is ideal for full-page setups.
      config.matchWebGLToCanvasSize = true; 

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        mobileWarning.style.display = "block";
        setTimeout(() => {
          mobileWarning.style.display = "none";
        }, 5000);
      }
      
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
    <script src="Build/WinterFox.loader.js"></script>
    <script defer="" src="file://" type="text/javascript"></script>
  </body>
</html>
