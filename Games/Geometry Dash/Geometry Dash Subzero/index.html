<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Geometry Dash Subzero</title>
    <meta name="description" content="Play Geometry Dash Subzero Online For Free on Chromebook, PC, Windows, Desktop in Chrome and modern browsers.">
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="img/GDS.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            padding: 0;
            margin: 0;
            border: 0;
            position: relative;
            visibility: hidden; /* Keep canvas hidden during loading */
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Loading Screen Styles */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .fullscreen-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .logo-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .robtop-logo {
            transform: scale(0.8);
            height: auto;
            margin-bottom: 4px;
        }

        .gj-logo {
            transform: scale(0.8);
            height: auto;
        }

        .loading-bar-wrapper {
            position: relative;
            margin-top: 20px;
            transform: scale(0.8);
            display: inline-block;
        }

        .slider-groove {
            display: block;
            height: auto;
            position: relative;
            z-index: 2;
        }

        .loading-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            z-index: 1;
            object-fit: cover;
            object-position: left;
            transition: width 0.1s linear;
        }

        .random-text-img {
            position: absolute;
            bottom: calc((45vh - 120px) / 2);
            left: 50%;
            transform: translateX(-50%) scale(0.5);
            z-index: 2;
            height: auto;
        }

        .bottom-right-logos {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .fmod-logo,
        .cocos-logo {
            height: auto;
            transform: scale(0.8);
        }

        .container {
            display: flex;
            background-color: #5d6b84;
            color: #fff;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="gameContainer"></div>

    <!-- Loading Screen Structure -->
    <div id="loadingScreen">
        <img class="fullscreen-bg" src="img/BG_Load.png" alt="Background">

        <div class="logo-container">
            <img class="robtop-logo" src="img/RobTopLogoBig_001.png" alt="RobTop Logo">
            <img class="gj-logo" src="img/GJ_logo_001.png" alt="Geometry Dash Logo">
            
            <div class="loading-bar-wrapper">
                <img class="slider-groove" src="img/slidergroove-uhd.png" alt="Loading Bar Groove">
                <img class="loading-fill" id="loadingFill" src="img/loadingBar-uhd.png" alt="Loading Bar Fill">
            </div>
        </div>

        <img id="randomText" class="random-text-img" src="" alt="Loading Text">

        <div class="bottom-right-logos">
            <img class="fmod-logo" src="img/fmodLogo.png" alt="FMOD Logo">
            <img class="cocos-logo" src="img/cocos2DxLogo.png" alt="Cocos2Dx Logo">
        </div>
    </div>

    <div class="container hidden" id="alert_rotate" style="display: none;">
        <div class="text-with-icon">
            <span class="svg-icon pleaserotate-graphic" aria-hidden="true">
                <svg class="svg-icon__link">
                    <use xlink:href="#icon-rotate"></use>
                </svg>
            </span>
            <p>Rotate your device to play like a pro</p>
        </div>
    </div>

    <script src="Build/UnityLoader.js"></script>
    <script>
        // Select random loading text image
        const randomIndex = Math.floor(Math.random() * 68) + 1;
        document.getElementById('randomText').src = `img/load-screen-text/text${randomIndex}.png`;

        const loadingFill = document.getElementById('loadingFill');
        const loadingScreen = document.getElementById('loadingScreen');
        const gameContainer = document.getElementById('gameContainer');

        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/geometrydash-subzero.json", {
            onProgress: function (instance, progress) {
                loadingFill.style.width = (progress * 100) + "%";
                
                if (progress === 1) {
                    // Wait 2000ms (2 seconds) after loading reaches 100%
                    setTimeout(() => {
                        gameContainer.style.visibility = "visible";
                        loadingScreen.style.display = "none";
                    }, 2000);
                }
            }
        });
    </script>
</body>
</html>
