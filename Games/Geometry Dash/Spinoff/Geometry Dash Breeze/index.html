<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Geometry Dash Breeze</title>
  <link rel="icon" type="image/png" href="img/GDB.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    /* Game Container - Covers the entire viewport */
    #gameContainer {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Unity Canvas - Fills full container width and height */
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      background: #000;
      display: block;
    }

    /* Loading Screen Container - On top of Unity canvas */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
    }

    /* Fullscreen Background Image */
    .fullscreen-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Centered Overlay Container */
    .logo-container {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .robtop-logo {
      transform: scale(1.5);
      height: auto;
      margin-bottom: 32px;
    }

    .gj-logo {
      transform: scale(1.5);
      height: auto;
    }

    /* Loading Bar Wrapper */
    .loading-bar-wrapper {
      position: relative;
      margin-top: 20px;
      transform: scale(0.8);
      display: inline-block;
    }

    .slider-groove {
      display: block;
      height: auto;
      position: relative;
      z-index: 2;
    }

    /* Inner Loading Fill with CSS Animation */
    .loading-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      z-index: 1;
      object-fit: cover;
      object-position: left; 
      animation: fillProgress 2s linear forwards;
    }

    @keyframes fillProgress {
      0% {
        width: 0%;
      }
      100% {
        width: 100%;
      }
    }

    /* Text Image */
    .random-text-img {
      position: absolute;
      bottom: calc((45vh - 120px) / 2);
      left: 50%;
      transform: translateX(-50%) scale(0.5);
      z-index: 2;
      height: auto;
    }

    /* Bottom Right Logos Stack */
    .bottom-right-logos {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .fmod-logo,
    .cocos-logo {
      height: auto;
      transform: scale(0.8);
    }
  </style>
</head>
<body>

  <!-- Game Container - Canvas stretched full screen underneath -->
  <div id="gameContainer">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <!-- Loading Screen Overlay -->
  <div id="loadingScreen">
    <img class="fullscreen-bg" src="img/BG_Load.png" alt="Background">

    <div class="logo-container">
      <img class="robtop-logo" src="img/RobTopLogoBig_001.png" alt="RobTop Logo">
      <img class="gj-logo" src="img/GJ_logo_001.png" alt="Geometry Dash Logo">
      
      <div class="loading-bar-wrapper">
        <img class="slider-groove" src="img/slidergroove-uhd.png" alt="Loading Bar Groove">
        <img class="loading-fill" id="loadingFill" src="img/loadingBar-uhd.png" alt="Loading Bar Fill">
      </div>
    </div>

    <img id="randomText" class="random-text-img" src="img/load-screen-text/text1.png" alt="Loading Text">

    <div class="bottom-right-logos">
      <img class="fmod-logo" src="img/fmodLogo.png" alt="FMOD Logo">
      <img class="cocos-logo" src="img/cocos2DxLogo.png" alt="Cocos2Dx Logo">
    </div>
  </div>

  <!-- Decompression Libraries -->
  <script src="Build/pako.min.js"></script>
  <script src="Build/brotli.min.js"></script>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingScreen = document.querySelector("#loadingScreen");
    const loadingFill = document.querySelector("#loadingFill");

    const jsonUrl = "Build/GeometryDashBreeze.json";

    let animationEnded = false;
    let unityLoaded = false;

    loadingFill.addEventListener('animationend', () => {
      animationEnded = true;
      hideLoadingIfReady();
    });

    function hideLoadingIfReady() {
      if (animationEnded && unityLoaded) {
        setTimeout(() => {
          loadingScreen.remove();
        }, 2000);
      }
    }

    function initUnity() {
      if (typeof createUnityInstance === "function") {
        createUnityInstance(canvas, jsonUrl, (progress) => {})
          .then((unityInstance) => {
            unityLoaded = true;
            hideLoadingIfReady();
          })
          .catch((message) => {
            alert("Unity WebGL Error: " + message);
          });
      } else if (typeof UnityLoader !== "undefined") {
        UnityLoader.instantiate("gameContainer", jsonUrl);
        unityLoaded = true;
        hideLoadingIfReady();
      } else {
        console.error("Neither createUnityInstance nor UnityLoader is defined.");
      }
    }

    const loaderScript = document.createElement("script");
    loaderScript.src = "Build/GeometryDashBreeze.loader.js";
    loaderScript.onload = () => {
      initUnity();
    };
    loaderScript.onerror = () => {
      console.error("Failed to load Build/GeometryDashBreeze.loader.js.");
    };
    document.body.appendChild(loaderScript);
  </script>

</body>
</html>
