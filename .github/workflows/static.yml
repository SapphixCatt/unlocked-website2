name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build 50 Independent Sites (Physical Copies - No Symlinks)
        run: |
          # 1. Create the final deployment directory
          mkdir -p _final_site
          
          # 2. Copy all root files/folders into _final_site (excluding _final_site itself)
          for item in *; do
            if [ "$item" != "_final_site" ]; then
              cp -R "$item" _final_site/ 2>/dev/null || true
            fi
          done
          
          # 3. Generate all 50 separate sub-sites using clean physical copies
          COUNTER=1
          while [ $COUNTER -le 50 ]; do
            SUB_DIR="_final_site/$COUNTER"
            mkdir -p "$SUB_DIR"
            
            # Copy index.html so the sub-site has its own entry point
            if [ -f "_final_site/index.html" ]; then
              cp "_final_site/index.html" "$SUB_DIR/index.html"
            fi
            
            # Copy every asset/folder physically into the sub-site directory
            for item in _final_site/*; do
              base_item=$(basename "$item")
              
              # Exclude index.html and numbers 1 to 50 to avoid recursive/nested loops
              if [ "$base_item" != "index.html" ]; then
                is_subsite=false
                if [ "$base_item" -ge 1 ] 2>/dev/null && [ "$base_item" -le 50 ] 2>/dev/null; then
                  is_subsite=true
                fi
                
                if [ "$is_subsite" = false ]; then
                  cp -R "$item" "$SUB_DIR/" 2>/dev/null || true
                fi
              fi
            done
            
            COUNTER=$((COUNTER + 1))
          done

      - name: Delete Stale GitHub-Pages Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const artifacts = response.data.artifacts.filter(a => a.name === 'github-pages');
            for (const artifact of artifacts) {
              console.log(`Deleting old artifact: ${artifact.id}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_final_site'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
