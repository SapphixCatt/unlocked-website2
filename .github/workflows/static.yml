name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build 50 Independent Sites via Symlinks
        run: |
          # Create the final deployment directory
          mkdir -p _final_site
          
          # Copy root files/folders while explicitly excluding _final_site to prevent infinite recursion
          for item in *; do
            if [ "$item" != "_final_site" ]; then
              cp -R "$item" _final_site/ 2>/dev/null || true
            fi
          done
          
          # Use a loop to generate all 50 separate sub-sites cleanly
          COUNTER=1
          while [ $COUNTER -le 50 ]; do
            mkdir -p "_final_site/$COUNTER"
            
            # Copy the index file so the sub-site functions independently
            if [ -f "index.html" ]; then
              cp index.html "_final_site/$COUNTER/index.html"
            fi
            
            # Map every other file/folder directly into this sub-site folder via symlinks
            for item in *; do
              if [ "$item" != "index.html" ] && [ "$item" != "_final_site" ]; then
                ln -s "../../$item" "_final_site/$COUNTER/$item" 2>/dev/null || true
              fi
            done
            
            COUNTER=$((COUNTER + 1))
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_final_site'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
